<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <!-- Load Tailwind CSS via CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Set the default font to Inter */
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary': '#1d4ed8', /* blue-700 */
                        'primary-dark': '#1e40af', /* blue-800 */
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white p-8 md:p-10 shadow-2xl rounded-xl border border-gray-100">

        <!-- Header -->
        <h2 class="text-3xl font-extrabold text-gray-900 text-center mb-2">
            Admin Dashboard Login
        </h2>
        <p class="text-center text-sm text-gray-500 mb-8">
            Please enter your credentials to access the system.
        </p>

        <!-- Error Message Display (Jinja2 Logic) -->
        {% if error %}
        <div class="mb-6 p-3 bg-red-100 border border-red-400 text-red-700 rounded-lg text-sm" role="alert">
            <p class="font-medium">{{ error }}</p>
        </div>
        {% endif %}

        <!-- Login Form -->
        <form class="space-y-6" action="/login" method="POST">
            
            <!-- Username Field -->
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <input 
                    id="username" 
                    name="username" 
                    type="text" 
                    required 
                    autocomplete="username"
                    placeholder="Enter your username"
                    class="appearance-none block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm transition duration-150 ease-in-out"
                >
            </div>

            <!-- Password Field -->
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input 
                    id="password" 
                    name="password" 
                    type="password" 
                    required 
                    autocomplete="current-password"
                    placeholder="password"
                    class="appearance-none block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm transition duration-150 ease-in-out"
                >
            </div>

            <!-- Submit Button -->
            <div>
                <button 
                    type="submit" 
                    class="w-full flex justify-center py-2 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-primary hover:bg-primary-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition duration-150 ease-in-out"
                >
                    Sign in
                </button>
            </div>
        </form>
        
    </div>
</body>
</html>
